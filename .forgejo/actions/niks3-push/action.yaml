---
name: niks3 push
description: >-
  Push store paths and their closures to a binary cache through niks3, which
  signs on ingest. Defaults target the nix.channings.me fleet cache. Uses the
  niks3 on PATH, else the one in nixham's nixpkgs.

inputs:
  token:
    description: CI token exchanged (RFC 8693) for short-lived access tokens
    required: true
  paths:
    description: Whitespace-separated store paths to push
    required: true
  server_url:
    description: niks3 server URL
    required: false
    default: https://niks3.nix.channings.me
  token_url:
    description: OAuth2 token-exchange endpoint
    required: false
    default: https://id.channings.me/oauth2/token
  client:
    description: OAuth2 client used as both audience and client_id
    required: false
    default: niks3

runs:
  using: composite
  steps:
    - name: Push to the niks3 server
      shell: bash
      env:
        NIKS3_CI_TOKEN: ${{ inputs.token }}
        NIKS3_SERVER_URL: ${{ inputs.server_url }}
        NIKS3_TOKEN_URL: ${{ inputs.token_url }}
        NIKS3_CLIENT: ${{ inputs.client }}
        action_path: ${{ github.action_path }}
        paths: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        : "${NIKS3_CI_TOKEN:?the niks3-push token input is empty}"
        niks3=niks3
        if ! command -v niks3 >/dev/null; then
          niks3=$(nix-build --no-out-link "$action_path/niks3.nix")/bin/niks3
        fi
        # $BASH, not bash: niks3 execs the script's argv[0] directly, and bash
        # isn't on PATH on every runner.
        # shellcheck disable=SC2086
        "$niks3" push --auth-token-script "$BASH $action_path/token.sh" $paths

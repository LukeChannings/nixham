---
name: Setup nix shell
description: >-
  Run the repo's devshell in every later step of the job, with no `nix-shell
  --run` wrapper: materialises devShells.ci (or devShells.default) once with
  nix print-dev-env and prepends its PATH via GITHUB_ENV. Needs Nix, jq, and a
  flake-compat default.nix in the checkout; fails the job if the shell does
  not materialise.

runs:
  using: composite
  steps:
    - name: Load the devshell PATH
      shell: bash
      env:
        action_path: ${{ github.action_path }}
      # $BASH, not bash: bash isn't on PATH on every runner.
      run: '"$BASH" "$action_path/setup.sh"'

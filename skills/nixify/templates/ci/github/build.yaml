---
name: Build

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        with:
          determinate: false
      - uses: lukechannings/nixham/.forgejo/actions/substituter@main
      - name: Build
        run: >-
          nix-build -E
          'builtins.getAttr builtins.currentSystem (import ./. { }).packages'
      # Fork PRs get no secrets.
      - name: Push to nix.channings.me
        if: >-
          github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: lukechannings/nixham/.forgejo/actions/niks3-push@main
        with:
          token: ${{ secrets.NIKS3_CI_TOKEN }}
          paths: ./result*

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: CHANGEME
            attr: CHANGEME
            transport: oci-archive
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        with:
          determinate: false
      - uses: lukechannings/nixham/.forgejo/actions/substituter@main
      - name: Push to ghcr.io
        uses: lukechannings/nixham/.forgejo/actions/oci-publish@main
        with:
          attr: ${{ matrix.attr }}
          transport: ${{ matrix.transport }}
          registry: ghcr.io
          name: ${{ matrix.name }}
          creds: ${{ github.actor }}:${{ github.token }}

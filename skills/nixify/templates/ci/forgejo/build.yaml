---
name: Build

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: nixos-latest
    steps:
      - name: Checkout
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: >-
          git clone --depth 1 -b "${HEAD_REF:-$REF_NAME}"
          "https://$TOKEN@forge.channings.me/$GITHUB_REPOSITORY.git" .
      # yamllint disable-line rule:line-length
      - uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/setup-nix-shell@main
      - name: Build
        run: just build
      # Fork PRs get no secrets.
      - name: Push to nix.channings.me
        if: >-
          github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/niks3-push@main
        with:
          token: ${{ secrets.NIKS3_CI_TOKEN }}
          paths: ./result*

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: build
    runs-on: nixos-latest
    strategy:
      matrix:
        include:
          - name: CHANGEME
            attr: CHANGEME
            transport: oci-archive
    steps:
      - name: Checkout
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: >-
          git clone --depth 1 -b "${HEAD_REF:-$REF_NAME}"
          "https://$TOKEN@forge.channings.me/$GITHUB_REPOSITORY.git" .
      - name: Push to forge.channings.me
        # yamllint disable-line rule:line-length
        uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/oci-publish@main
        with:
          attr: ${{ matrix.attr }}
          transport: ${{ matrix.transport }}
          registry: forge.channings.me
          name: ${{ matrix.name }}
          creds: forgejo:${{ secrets.FORGE_PAT }}
